spring.application.name=AirTortilla

# Server
server.port=8080

# PostgreSQL Datasource (Defaults to standard Docker/local setup, overridable via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/airtortilla}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:airtortilla}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:airtortilla}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# OpenAPI Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
