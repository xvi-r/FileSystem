services:
  postgres:
    image: postgres:16-alpine
    container_name: airtortilla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airtortilla
      POSTGRES_USER: airtortilla
      POSTGRES_PASSWORD: airtortilla
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airtortilla -d airtortilla"]
      interval: 5s
      timeout: 5s
      retries: 5

  airtortilla-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: xvirr/airtortilla:latest
    container_name: airtortilla-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/airtortilla
      - SPRING_DATASOURCE_USERNAME=airtortilla
      - SPRING_DATASOURCE_PASSWORD=airtortilla
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

volumes:
  postgres_data:
